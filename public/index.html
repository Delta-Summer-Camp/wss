<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>WSS front end test</title>
    <script src="js/lib/phaser.min.js"></script>
    <script src="js/lib/DebugSys.js"></script>
    <script src="js/lib/CloneSys.js"></script>
    <script src="js/lib/ScratchGame.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style type="text/css">
        body {
            margin: 0;
        }
    </style>
</head>

<body>

    <!-- Registration -->
    <div id="registration"
        class="fixed hidden inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-md">
        <div
            class="bg-slate-700/80 p-8 text-white rounded-3xl border border-slate-600 shadow-2xl text-left max-w-sm w-full mx-4">
            <h1 class="text-3xl font-bold mb-4">Registration</h1>
            <form method="post" class="flex flex-col gap-4">

                <div class="flex flex-col gap-1.5">
                    <label for="reg-username" class="font-medium text-sm">Username:</label>
                    <input
                        class="w-full bg-slate-600 hover:bg-slate-500 rounded-xl py-2 px-4 border border-white text-white focus:outline-none"
                        type="text" id="reg-username" name="username">
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="reg-password" class="font-medium text-sm">Password:</label>
                    <input
                        class="w-full bg-slate-600 hover:bg-slate-500 rounded-xl py-2 px-4 border border-white text-white focus:outline-none"
                        type="password" id="reg-password" name="password">
                </div>

                <div class="flex flex-col gap-1.5">
                    <label for="password2" class="font-medium text-sm">Retype password:</label>
                    <input
                        class="w-full bg-slate-600 hover:bg-slate-500 rounded-xl py-2 px-4 border border-white text-white focus:outline-none"
                        type="password" id="password2" name="password2">
                </div>

                <input onclick="startScreen()"
                    class="w-full py-3 px-6 mt-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold text-lg rounded-xl shadow-lg transition duration-200 cursor-pointer"
                    type="button" value="Send">
            </form>
        </div>
    </div>

    <!-- Login -->

    <div id="login" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-md">
        <div
            class="bg-slate-700/80 p-8 text-white rounded-3xl border border-slate-600 shadow-2xl text-center max-w-sm w-full mx-4">
            <h1 class="text-3xl font-bold mb-4">Login</h1>
            <form method="post">
                <label for="login-username">Username:</label>
                <input class="bg-slate-600 hover:bg-slate-500 rounded-xl py-2 px-4 border border-white" type="text"
                    id="login-username" name="username"><br><br>

                <label for="login-password">Password:</label>
                <input class="bg-slate-600 hover:bg-slate-500 rounded-xl py-2 px-4 border border-white" type="password"
                    id="login-password" name="password"><br><br>

                <input onclick="startScreen()"
                    class="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold text-lg rounded-xl shadow-lg transition duration-200 cursor-pointer"
                    type="button" value="Send">
            </form>
            <p class="mt-4">Don't have an account? <a href="#" onclick="register()"
                    class="text-indigo-400 underline">Register here</a></p>
        </div>
    </div>

    <!-- Play Button -->

    <div id="start-screen"
        class="fixed hidden inset-0 z-50 flex items-center justify-center bg-slate-900/80 backdrop-blur-md">
        <div
            class="bg-slate-800/90 p-8 rounded-2xl border border-slate-700 shadow-2xl text-center max-w-sm w-full mx-4">
            <h1 class="text-4xl font-black text-white tracking-wider mb-2 drop-shadow-md"> MAZE GAME </h1>
            <p class="text-slate-400 text-sm mb-8"> Use <span class="text-indigo-400 font-semibold">WASD</span> keys
                to navigate the maze. </p>

                
            <button onclick="startGame()"
                class="w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold text-lg rounded-xl shadow-lg transition duration-200 cursor-pointer">PLAY
                NOW </button>
        </div>
    </div>

    <script src="js/script_tailwind.js"></script>
    <script type="module" src="js/game.js">

    </script>

</body>

</html>
